<section class="form-section">
  <h2 class="section-title">Identificación del Cargo</h2>
  <div class="form-grid">
    <div class="form-group required">
      <label for="cargo">Nombre del Cargo</label>
      <input type="text" id="cargo" name="cargo" [ngModel]="cargo" (ngModelChange)="cargoChange.emit($event)" required
        placeholder="Analista Contable" />
    </div>

    <div class="form-group required">
      <label for="area">Área</label>
      <input type="text" id="area" name="area" [ngModel]="area" (ngModelChange)="areaChange.emit($event)" required
        placeholder="Finanzas" />
    </div>

    <div class="form-group">
      <label for="contractual">Clasificación Contractual</label>
      <input type="text" id="contractual" name="contractual" [ngModel]="contractual"
        (ngModelChange)="contractualChange.emit($event)" placeholder="Gestor Administrativo" />
    </div>

    <div class="form-group">
      <label for="reporta_a">Reporta a</label>
      <input type="text" id="reporta_a" name="reporta_a" [ngModel]="reporta_a"
        (ngModelChange)="reporta_aChange.emit($event)" placeholder="Contador / Tesorería" />
    </div>

    <div class="form-group full-width">
      <label for="supervisa">Supervisa</label>
      <input type="text" id="supervisa" name="supervisa" [ngModel]="supervisa"
        (ngModelChange)="supervisaChange.emit($event)" placeholder="No aplica / Asistente contable" />
    </div>

    <div class="form-group">
      <label for="grupoCargo">Grupo de cargo (matriz de competencias)</label>
      <select id="grupoCargo" name="grupoCargo" [ngModel]="grupoCargo" (ngModelChange)="grupoCargoChange.emit($event || null)">
        <option [ngValue]="null">Sin asignar</option>
        <option *ngFor="let g of gruposCargo" [ngValue]="g.id">{{ g.nombre }}</option>
      </select>
      <small class="field-hint">Define las competencias, niveles y pesos que se evalúan en la entrevista.</small>
    </div>

    <div class="form-group full-width">
      <label for="lider">Líder de área responsable</label>
      <select id="lider" name="lider" [ngModel]="liderId" (ngModelChange)="liderIdChange.emit($event || null)">
        <option [ngValue]="null">Sin asignar</option>
        <option *ngFor="let lider of lideres" [ngValue]="lider.id">
          {{ lider.nombre }}{{ lider.area ? ' — ' + lider.area : '' }}
        </option>
      </select>
      <small class="field-hint">El líder asignado podrá solicitar vacantes de este cargo y ver a sus candidatos.</small>
    </div>
  </div>
</section>
