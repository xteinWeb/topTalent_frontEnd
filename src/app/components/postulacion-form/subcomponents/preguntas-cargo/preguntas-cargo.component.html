<div class="tab-pane">
  <fieldset class="form-fieldset">
    <legend>Preguntas del Cargo</legend>
    <p style="font-size: 0.85rem; color: #64748b; margin: 0 0 1.25rem 0;">
      Responda las siguientes preguntas relacionadas con el cargo al que se está postulando. Las preguntas marcadas
      como <strong>Obligatoria</strong> deben responderse para poder enviar la postulación.
    </p>

    <div class="questions-answer-list" style="display: flex; flex-direction: column; gap: 1.25rem;">
      <div class="question-answer-card" *ngFor="let preg of preguntas; let i = index"
        style="background: #ffffff; border: 1.5px solid var(--brand-beige-dark, #ddd); border-radius: 8px; padding: 1.25rem;">

        <div style="display: flex; justify-content: space-between; align-items: flex-start; gap: 0.75rem; margin-bottom: 0.75rem;">
          <span style="font-weight: 700; color: var(--brand-navy, #16313a); font-size: 0.95rem;">
            {{ i + 1 }}. {{ preg.pregunta }}
          </span>
          <span *ngIf="preg.obligatoria" style="flex-shrink: 0; font-size: 0.7rem; color: #c0392b; background: #fde8e8; padding: 0.15rem 0.5rem; border-radius: 4px; font-weight: 600; white-space: nowrap;">
            Obligatoria
          </span>
        </div>

        <!-- Pregunta Cerrada: opciones -->
        <div *ngIf="preg.tipo === 'Cerrada' && preg.opciones" style="display: flex; flex-direction: column; gap: 0.5rem;">
          <label *ngFor="let opt of preg.opciones; let j = index"
            style="display: flex; align-items: center; gap: 0.5rem; font-size: 0.9rem; cursor: pointer;">
            <input type="radio" name="preg_resp_{{i}}" [(ngModel)]="preg.respuesta" [value]="opt.valor"
              (ngModelChange)="onRespuestaChange()" />
            {{ opt.etiqueta || opt.valor }}
          </label>
        </div>

        <!-- Pregunta Abierta -->
        <textarea *ngIf="preg.tipo !== 'Cerrada'" rows="3" [(ngModel)]="preg.respuesta"
          (ngModelChange)="onRespuestaChange()" name="preg_resp_{{i}}"
          placeholder="Escriba su respuesta aquí..."
          style="width: 100%; border-radius: 4px; border: 1.5px solid #ddd; padding: 0.5rem; font-family: inherit; resize: vertical;"></textarea>
      </div>
    </div>
  </fieldset>
</div>
