<div class="login-wrapper">
  <div class="login-card">
    <div class="login-brand">
      <img src="images/Logo-ARTDECON-HD-fondo-transparente-(logo-negro).png" alt="ARTDECON Logo" class="brand-logo" onerror="this.style.display='none'">
      <h2>Portal de Empleo</h2>
      <p class="subtitle">Ingresa para postularte a las vacantes</p>
    </div>

    <form (ngSubmit)="onSubmit()" #loginForm="ngForm" class="login-form">
      <div *ngIf="errorMessage" class="error-alert">
        <span class="error-icon">⚠️</span>
        <span class="error-text">{{ errorMessage }}</span>
      </div>

      <div class="form-group">
        <label for="email">Correo Electrónico</label>
        <input 
          type="email" 
          id="email" 
          name="email" 
          [(ngModel)]="email" 
          required 
          placeholder="correo@ejemplo.com"
          autocomplete="email"
        />
      </div>

      <div class="form-group">
        <label for="password">Contraseña</label>
        <input 
          type="password" 
          id="password" 
          name="password" 
          [(ngModel)]="password" 
          required 
          placeholder="Ingresa tu contraseña"
          autocomplete="current-password"
        />
      </div>

      <button type="submit" class="btn btn-login" [disabled]="loading || !email || !password">
        {{ loading ? 'Iniciando sesión...' : 'Ingresar' }}
      </button>
    </form>

    <div class="register-prompt">
      <p>¿No tienes cuenta? <a routerLink="/candidato/registro" [queryParams]="{ returnUrl: returnUrl }">Regístrate aquí</a></p>
    </div>
  </div>
</div>
