<div class="login-wrapper">
  <div class="login-card">
    <div class="login-brand">
      <h2>Artdecon</h2>
      <p class="subtitle">Recuperar contraseña</p>
    </div>

    <!-- Paso 1: Usuario o correo -->
    <form *ngIf="!showCodigoStep" (ngSubmit)="solicitarCodigo()" class="login-form">
      <div *ngIf="errorMessage" class="error-alert">
        <span class="error-icon">⚠️</span>
        <span class="error-text">{{ errorMessage }}</span>
      </div>

      <p class="info-text">Ingrese su usuario o correo. Enviaremos un código al correo registrado en su cuenta.</p>

      <div class="form-group">
        <label for="usuario">Usuario o correo</label>
        <input
          type="text"
          id="usuario"
          name="usuario"
          [(ngModel)]="usuario"
          required
          placeholder="Ingresa tu usuario o correo"
          autocomplete="username"
        />
      </div>

      <button type="submit" class="btn btn-login" [disabled]="loading || !usuario.trim()">
        {{ loading ? 'Enviando...' : 'Enviar código' }}
      </button>
    </form>

    <!-- Paso 2: Código y nueva contraseña -->
    <form *ngIf="showCodigoStep" (ngSubmit)="restablecer()" class="login-form">
      <div *ngIf="errorMessage" class="error-alert">
        <span class="error-icon">⚠️</span>
        <span class="error-text">{{ errorMessage }}</span>
      </div>

      <p class="info-text">{{ infoMessage }} El código vence en 15 minutos.</p>

      <div class="form-group">
        <label for="codigo">Código de recuperación</label>
        <input
          type="text"
          id="codigo"
          name="codigo"
          [(ngModel)]="codigo"
          required
          maxlength="6"
          placeholder="000000"
          style="text-align: center; font-size: 1.5rem; letter-spacing: 6px; font-weight: 700;"
          autocomplete="one-time-code"
        />
      </div>

      <div class="form-group">
        <label for="password">Nueva contraseña</label>
        <input
          type="password"
          id="password"
          name="password"
          [(ngModel)]="password"
          required
          minlength="6"
          placeholder="Mínimo 6 caracteres"
          autocomplete="new-password"
        />
      </div>

      <div class="form-group">
        <label for="confirmPassword">Confirmar contraseña</label>
        <input
          type="password"
          id="confirmPassword"
          name="confirmPassword"
          [(ngModel)]="confirmPassword"
          required
          placeholder="Repite la nueva contraseña"
          autocomplete="new-password"
        />
      </div>

      <button type="submit" class="btn btn-login" [disabled]="loading || codigo.trim().length !== 6 || !password || !confirmPassword">
        {{ loading ? 'Guardando...' : 'Cambiar contraseña e ingresar' }}
      </button>

      <button type="button" class="btn-secundario" (click)="volver()">Atrás</button>
    </form>

    <div class="login-links">
      <a routerLink="/login">Volver al inicio de sesión</a>
    </div>
  </div>
</div>
