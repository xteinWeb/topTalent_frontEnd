<div class="login-wrapper">
  <div class="login-card">
    <div class="login-brand">
      <img src="images/Logo-ARTDECON-HD-fondo-transparente-(logo-negro).png" alt="ARTDECON Logo" class="brand-logo" onerror="this.style.display='none'">
      <h2>Registro de Candidato</h2>
      <p class="subtitle">Regístrate para guardar tu hoja de vida</p>
    </div>

    <form (ngSubmit)="onSubmit()" #regForm="ngForm" class="login-form">
      <div *ngIf="errorMessage" class="error-alert">
        <span class="error-icon">⚠️</span>
        <span class="error-text">{{ errorMessage }}</span>
      </div>

      <div class="form-group">
        <label for="email">Correo Electrónico</label>
        <input 
          type="email" 
          id="email" 
          name="email" 
          [(ngModel)]="email" 
          required 
          placeholder="correo@ejemplo.com"
          autocomplete="email"
        />
      </div>

      <div class="form-group">
        <label for="password">Contraseña</label>
        <input 
          type="password" 
          id="password" 
          name="password" 
          [(ngModel)]="password" 
          required 
          minlength="6"
          placeholder="Crea una contraseña (mínimo 6 caracteres)"
          autocomplete="new-password"
        />
      </div>

      <div class="form-group">
        <label for="confirmPassword">Confirmar Contraseña</label>
        <input 
          type="password" 
          id="confirmPassword" 
          name="confirmPassword" 
          [(ngModel)]="confirmPassword" 
          required 
          placeholder="Repite la contraseña"
          autocomplete="new-password"
        />
      </div>

      <button type="submit" class="btn btn-login" [disabled]="loading || !email || !password || !confirmPassword">
        {{ loading ? 'Registrando...' : 'Registrarse' }}
      </button>
    </form>

    <div class="register-prompt">
      <p>¿Ya tienes una cuenta? <a routerLink="/candidato/login" [queryParams]="{ returnUrl: returnUrl }">Inicia sesión</a></p>
    </div>
  </div>
</div>
