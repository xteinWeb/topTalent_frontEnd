<div class="login-wrapper">
  <div class="login-card">
    <div class="login-brand">
      <img src="images/Logo-ARTDECON-HD-fondo-transparente-(logo-negro).png" alt="ARTDECON Logo" class="brand-logo" onerror="this.style.display='none'">
      <h2>Registro de Candidato</h2>
      <p class="subtitle">Regístrate para guardar tu hoja de vida</p>
    </div>

    <!-- Paso 1: Registro -->
    <form *ngIf="!showVerificationStep" (ngSubmit)="onSubmit()" #regForm="ngForm" class="login-form">
      <div *ngIf="errorMessage" class="error-alert">
        <span class="error-icon">⚠️</span>
        <span class="error-text">{{ errorMessage }}</span>
      </div>

      <div class="form-group">
        <label for="email">Correo Electrónico</label>
        <input 
          type="email" 
          id="email" 
          name="email" 
          [(ngModel)]="email" 
          required 
          placeholder="correo@ejemplo.com"
          autocomplete="email"
        />
      </div>

      <div class="form-group">
        <label for="password">Contraseña</label>
        <input 
          type="password" 
          id="password" 
          name="password" 
          [(ngModel)]="password" 
          required 
          minlength="6"
          placeholder="Crea una contraseña (mínimo 6 caracteres)"
          autocomplete="new-password"
        />
      </div>

      <div class="form-group">
        <label for="confirmPassword">Confirmar Contraseña</label>
        <input 
          type="password" 
          id="confirmPassword" 
          name="confirmPassword" 
          [(ngModel)]="confirmPassword" 
          required 
          placeholder="Repite la contraseña"
          autocomplete="new-password"
        />
      </div>

      <button type="submit" class="btn btn-login" [disabled]="loading || !email || !password || !confirmPassword">
        {{ loading ? 'Registrando...' : 'Registrarse' }}
      </button>
    </form>

    <!-- Paso 2: Verificación de Código -->
    <form *ngIf="showVerificationStep" (ngSubmit)="verifyCode()" #verifyForm="ngForm" class="login-form">
      <div *ngIf="errorMessage" class="error-alert">
        <span class="error-icon">⚠️</span>
        <span class="error-text">{{ errorMessage }}</span>
      </div>

      <div style="text-align: center; margin-bottom: 1.5rem;">
        <span class="material-icons" style="font-size: 3rem; color: var(--brand-gold, #B39C70); display: block; margin-bottom: 0.5rem;">mail_outline</span>
        <p style="font-size: 0.9rem; color: #475569; line-height: 1.4;">Hemos enviado un código de verificación de 6 dígitos al correo: <strong style="color: var(--brand-navy, #16313A);">{{ email }}</strong></p>
      </div>

      <div class="form-group">
        <label for="verificationCode" style="text-align: center; display: block; font-weight: 700; letter-spacing: 0.5px;">Código de Verificación</label>
        <input 
          type="text" 
          id="verificationCode" 
          name="verificationCode" 
          [(ngModel)]="verificationCode" 
          required 
          maxlength="6"
          placeholder="000000"
          style="text-align: center; font-size: 1.5rem; letter-spacing: 6px; font-weight: 700; padding: 0.5rem;"
          autocomplete="one-time-code"
        />
      </div>

      <button type="submit" class="btn btn-login" [disabled]="loading || !verificationCode || verificationCode.trim().length !== 6">
        {{ loading ? 'Verificando...' : 'Verificar y Activar Cuenta' }}
      </button>

      <button type="button" class="btn" style="background: transparent; color: #64748b; border: 1px solid #cbd5e1; margin-top: 0.75rem; width: 100%;" (click)="showVerificationStep = false; errorMessage = ''">
        Atrás
      </button>
    </form>

    <div class="register-prompt" *ngIf="!showVerificationStep">
      <p>¿Ya tienes una cuenta? <a routerLink="/candidato/login" [queryParams]="{ returnUrl: returnUrl }">Inicia sesión</a></p>
    </div>
  </div>
</div>
